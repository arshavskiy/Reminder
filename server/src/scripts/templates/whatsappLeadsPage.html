<title>WhatsApp Leads</title>
<style>
  :root {
    --brand: #18a058;
    --brand-dark: #0c7a43;
    --bg: #f8fafb;
    --white: #ffffff;
    --border: #e2e8f0;
    --text: #1a1a2e;
    --text-2: #4a5568;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14171a;
      --white: #1e2227;
      --border: #2c3138;
      --text: #f1f5f4;
      --text-2: #9aa5ac;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14171a;
    --white: #1e2227;
    --border: #2c3138;
    --text: #f1f5f4;
    --text-2: #9aa5ac;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; direction: rtl; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 20px 16px 60px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--text-2); font-size: 13px; margin: 0 0 16px; }
  .warn {
    background: color-mix(in srgb, #f0b429 15%, var(--white));
    border: 1px solid color-mix(in srgb, #f0b429 40%, var(--border));
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 13px;
    margin-bottom: 16px;
  }
  .controls {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }

  input[type="search"], select {
    flex: 1;
    min-width: 160px;
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--white);
    color: var(--text);
    font-size: 14px;
  }

  select {
      flex: 0 1 220px;
      min-width: 180px;
  }
  .count { font-size: 12px; color: var(--text-2); white-space: nowrap; }
  .row {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 8px;
  }
  .row[hidden] { display: none; }
  .row--sent { opacity: 0.55; }
  .row__main { flex: 1; min-width: 0; }
  .row__name { font-weight: 600; font-size: 14px; }
  .row__meta { font-size: 12px; color: var(--text-2); }
  .row__nolink { font-size: 11px; color: #b45309; }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 12px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    text-decoration: none;
    border: none;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn--wa { background: #25d366; color: #06210f; }
  .btn--sent { background: var(--border); color: var(--text-2); }
  .btn--copy { background: transparent; border: 1px solid var(--border); color: var(--text-2); padding: 7px 10px; }
</style>

<div class="wrap">
  <h1>שליחת הודעות WhatsApp ללידים</h1>
  <p class="sub">כל שורה פותחת WhatsApp עם הודעה מוכנה מראש — עדיין צריך ללחוץ שליחה ידנית שם.</p>
  <div class="warn">
    ⚠️ קישורי הכניסה בהודעות תקפים ל-30 יום מרגע ההפקה ולשימוש חד-פעמי. אם עברו 30 יום — יש להריץ מחדש את הסקריפט לפני שליחה.
  </div>
  <div class="controls">
      <input id="search" placeholder="חיפוש לפי שם, עיר או מקצוע..." type="search"/>
      <select id="profession">
          <option value="">כל בעלי המקצוע</option>
      </select>
    <span class="count" id="count"></span>
  </div>
  <div id="list"></div>
</div>

<script>
  const LEADS = __LEADS_JSON__;

  function messageBodyFor(lead) {
      const types = (lead.professionType || []).join(" ");
      if (types.includes("מנהל עבודה")) {
          return "אנחנו מפתחים מערכת למנהלי עבודה שמרכזת מסמכי אתר, בדיקות ציוד, לקוחות ומועדי תוקף במקום אחד. המערכת מחלצת מידע מקבצי PDF, מציגה את הבדיקות ביומן ושולחת תזכורות לפני המועד הבא.";
      }
      if (types.includes("ממונה על בטיחות")) {
          return "אנחנו מפתחים מערכת לממוני בטיחות שמרכזת תסקירים, ציוד, לקוחות ומועדי בדיקות. אפשר להעלות מסמכים קיימים, לחלץ מהם את הנתונים אוטומטית, לעקוב ביומן ולהפיק דוחות מסודרים ללקוחות.";
      }
      if (types.includes("מעליתן") || types.includes("מעליות")) {
          return "אנחנו מפתחים מערכת לאנשי וחברות מעליות שמרכזת מסמכי בדיקה, לקוחות, מתקנים ומועדי ביקורת. המערכת קוראת קבצי PDF, מזהה תאריכי תוקף ושולחת תזכורות לקראת הבדיקה או הטיפול הבא.";
      }
      if (types.includes("בודק מוסמך") || types.includes("בודק")) {
          return "בנינו מערכת לבודקים מוסמכים שחוסכת את ההקלדה החוזרת: היא מייבאת תסקירים ומסמכים, מחלצת מהם תאריכי תוקף ופרטי לקוח, שולחת תזכורות ומאפשרת ליצור תסקיר והצעת מחיר מותאמים לכל סוג בדיקה.";
      }
      if (types.includes("חברה") || types.includes("שירות") || types.includes("מעבדה")) {
          return "אנחנו מפתחים מערכת לחברות שירות ובדיקה שמרכזת לקוחות, מסמכים, ציוד ומועדי בדיקות. אפשר לחלץ מידע מקבצי PDF, לנהל את העבודה ביומן, לשלוח תזכורות ולהפיק דוחות והצעות מחיר.";
      }
      return "אנחנו מפתחים מערכת לבעלי מקצוע בתחום הבדיקות והבטיחות שמרכזת מסמכים, לקוחות ומועדי בדיקות, מחלצת נתונים מקבצי PDF ושולחת תזכורות אוטומטיות לקראת המועד הבא.";
  }

  const MESSAGE_TEMPLATE = (lead) => {
    const intro = "שלום" + (lead.name ? " " + lead.name : "") + ", מדבר פבל מ-RemindOCR.";
      const profession = (lead.professionType || []).join(", ");
      const professionLine = profession ? ("ראיתי שאתה עוסק בתחום " + profession + ".") : "";
    const site = "www.remindocr.com";
      const body = messageBodyFor(lead);
    const pricing = "המחיר נוח — החל מ-79 ש\"ח לחודש, ו-30 יום ניסיון חינם, בלי כרטיס אשראי.";
    const link = lead.magicLink ? ("קישור כניסה מהיר: " + lead.magicLink) : "אשמח לשלוח לך קישור כניסה אם תרצה/י להתנסות.";
    const outro = "אני תמיד זמין לשיחה קצרה ולהראות את המערכת בלייב, בלי התחייבות.";
    // return intro + "\n" + site + "\n\n" + body + "\n\n" + pricing + "\n" + link + "\n\n" + outro;
      return [intro, professionLine, site, body, link, outro].filter(Boolean).join("\n");
  };

  function waLink(lead) {
    const text = encodeURIComponent(MESSAGE_TEMPLATE(lead));
    return "https://wa.me/" + lead.waPhone + "?text=" + text;
  }

  const listEl = document.getElementById("list");
  const searchEl = document.getElementById("search");
  const professionEl = document.getElementById("profession");
  const countEl = document.getElementById("count");

  [...new Set(LEADS.flatMap((lead) => lead.professionType || []))]
      .sort((a, b) => a.localeCompare(b, "he"))
      .forEach((profession) => {
          const option = document.createElement("option");
          option.value = profession;
          option.textContent = profession;
          professionEl.appendChild(option);
      });

  function sentKey(i) { return "wa-lead-sent-" + i; }
  function isSent(i) {
    try { return localStorage.getItem(sentKey(i)) === "1"; } catch (e) { return false; }
  }
  function markSent(i) {
    try { localStorage.setItem(sentKey(i), "1"); } catch (e) {}
  }

  function render() {
    const q = searchEl.value.trim().toLowerCase();
      const selectedProfession = professionEl.value;
    listEl.innerHTML = "";
    let shown = 0;
    LEADS.forEach((lead, i) => {
        const professions = lead.professionType || [];
        const certifications = lead.certificationType || [];
        const hay = [lead.name, lead.city, ...professions, ...certifications].join(" ").toLowerCase();
      if (q && !hay.includes(q)) return;
        if (selectedProfession && !professions.includes(selectedProfession)) return;
      shown++;
      const row = document.createElement("div");
      row.className = "row" + (isSent(i) ? " row--sent" : "");
      row.innerHTML =
        '<div class="row__main">' +
          '<div class="row__name"></div>' +
          '<div class="row__meta"></div>' +
        '</div>' +
        (lead.magicLink ? "" : '<span class="row__nolink">אין קישור כניסה</span>') +
        '<button class="btn btn--copy" type="button" title="העתק מספר">📋</button>' +
        '<a class="btn btn--wa" target="_blank" rel="noopener">שלח ב-WhatsApp</a>';

      row.querySelector(".row__name").textContent = lead.name || "(ללא שם)";
        row.querySelector(".row__meta").textContent = [professions.join(" · "), lead.city, lead.phone].filter(Boolean).join(" · ");

      const waBtn = row.querySelector(".btn--wa");
      waBtn.href = waLink(lead);
      waBtn.addEventListener("click", () => {
        markSent(i);
        row.classList.add("row--sent");
      });

      row.querySelector(".btn--copy").addEventListener("click", () => {
        navigator.clipboard?.writeText(lead.phone).catch(() => {});
      });

      listEl.appendChild(row);
    });
    countEl.textContent = shown + " / " + LEADS.length;
  }

  searchEl.addEventListener("input", render);
  professionEl.addEventListener("change", render);
  render();
</script>
