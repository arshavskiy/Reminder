  /api/user-settings:
    get:
      summary: Get user settings
      tags: [ Settings ]
      responses:
        200:
          description: User settings

    put:
      summary: Update user settings
      tags:
        - Settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                discovery_auto_scan:
                  type: boolean
                  description: Weekly Gmail discovery scan with notification and push for new
                    finds. Enabling requires Gmail connected and a plan with
                    document import.
                discovery_langs:
                  type: array
                  items:
                    type: string
                    enum:
                      - he
                      - en
                      - ru
                  description: Languages used by the weekly scan
                whats_new_seen:
                  type: string
                  nullable: true
                  pattern: ^[\w.-]{1,32}$
                  example: 2026-10
                  description: Release id of the last What's new card the user dismissed
                discovery_scan_frequency:
                  type: string
                  enum:
                    - daily
                    - weekly
                  default: weekly
                  description: How often the automatic discovery scan runs (needs
                    `discovery_auto_scan`).
                invoices_auto_scan:
                  type: boolean
                  description: Daily automatic import of new invoices and receipts from Gmail
                    (last 14 days). Business plan only (403
                    `gmail_invoice_plan_required` otherwise); needs Gmail
                    connected to do anything. Notifies the user when invoices
                    were imported.
              additionalProperties: true
      responses:
        "200":
          description: Settings updated
        "400":
          description: Invalid value
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: error
                  message:
                    type: string
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: error
                  message:
                    type: string
        "403":
          description: Plan does not allow the requested scan option
            (`plan_no_document_import` for the discovery scan,
            `gmail_invoice_plan_required` for the daily invoice scan)
