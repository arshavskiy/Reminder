  /api/invoices/pairs/scan:
    post:
      summary: Pair receipts with the invoices they paid
      tags:
        - Invoices
      description: "Backfill: tries every receipt that has no pair yet and links it
        when exactly one invoice matches (same supplier, amount and currency,
        receipt dated within 90 days after the invoice)."
      responses:
        "200":
          description: Counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  scanned:
                    type: integer
                    description: Unpaired receipts examined
                  linked:
                    type: integer
                    description: Pairs created
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
  /api/invoices/{id}/pair:
    post:
      summary: Confirm an invoice/receipt pair by hand
      tags:
        - Invoices
      description: Body `with` is the id of the other half. One side must be an
        invoice, bill or payment request and the other a receipt. Replaces any
        earlier pair on either side.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Invoice id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - with
              properties:
                with:
                  type: string
                  description: Id of the other half of the pair
      responses:
        "200":
          description: Pair confirmed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  paired_with:
                    type: string
        "400":
          description: Bad ids, the same id twice, or both documents are the same kind
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: pair_needs_invoice_and_receipt
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
        "404":
          description: One of the invoices was not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Invoice not found
    delete:
      summary: Break an invoice/receipt pair
      tags:
        - Invoices
      description: Both sides are freed and remembered as not matching, so the matcher
        does not re-link them.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Invoice id
      responses:
        "200":
          description: Pair broken
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  unpaired:
                    type: string
                    nullable: true
                    description: Id of the former partner, null if it had none
        "400":
          description: Invalid invoice id
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Invalid invoice id
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
        "404":
          description: Invoice not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Invoice not found
  /api/review:
    get:
      summary: List imports waiting for review
      tags:
        - Import Review
      description: Documents that Gmail import, email-in or Drive brought in
        unattended and that look wrong (missing amount or date, unidentified
        supplier, low confidence, possibly not an invoice, no expiry date).
        Newest first.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - pending
              - approved
              - dismissed
            default: pending
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Review items
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Document id
                        file_name:
                          type: string
                        document_type:
                          type: string
                          nullable: true
                        source:
                          type: string
                          enum:
                            - gmail
                            - email
                            - drive
                        reasons:
                          type: array
                          items:
                            type: string
                            enum:
                              - low_confidence
                              - missing_amount
                              - missing_date
                              - unknown_supplier
                              - possible_not_invoice
                              - missing_fields
                              - no_expiry_date
                        flagged_at:
                          type: string
                          format: date-time
                          nullable: true
                        supplier:
                          type: string
                          nullable: true
                        amount_display:
                          type: string
                          nullable: true
                        issue_date:
                          type: string
                          format: date
                          nullable: true
                        invoice_id:
                          type: string
                          nullable: true
                        download_url:
                          type: string
                          nullable: true
                        thumbnail_url:
                          type: string
                          nullable: true
                  total:
                    type: integer
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
  /api/review/count:
    get:
      summary: Number of imports waiting for review (badge and dashboard banner)
      tags:
        - Import Review
      responses:
        "200":
          description: Pending count
          content:
            application/json:
              schema:
                type: object
                properties:
                  pending:
                    type: integer
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
  /api/review/approve:
    post:
      summary: Approve imports (looks right)
      tags:
        - Import Review
      description: Body `ids`. Clears the flag; an invoice flagged as possibly not an
        invoice starts counting as one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - ids
              properties:
                ids:
                  type: array
                  items:
                    type: string
                  maxItems: 500
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  approved:
                    type: integer
                  pending:
                    type: integer
                    description: Items still waiting
        "400":
          description: No ids
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: ids required
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
  /api/review/{id}/corrections:
    put:
      summary: Correct a pending invoice review without approving it
      tags: [Import Review]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [supplier_name, amount, currency, issue_date]
              properties:
                supplier_name: {type: string, maxLength: 300}
                amount: {type: number}
                currency: {type: string, minLength: 3, maxLength: 3}
                issue_date: {type: string, format: date}
      responses:
        "200": {description: Invoice and extracted document fields updated}
        "400": {description: Invalid correction fields}
        "401": {description: Not signed in}
        "404": {description: Pending invoice review not found for this user}
        "500": {description: Corrections could not be saved}
  /api/review/{id}/dismiss:
    post:
      summary: Dismiss an import (not wanted)
      tags:
        - Import Review
      description: Archives its invoice and dismisses the pending reminders created
        from the document.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Document id
      responses:
        "200":
          description: Dismissed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  remindersDismissed:
                    type: integer
                  pending:
                    type: integer
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
        "404":
          description: Not in the review queue
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Not found in the review queue

