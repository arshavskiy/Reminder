      tags:
        - Reminder Discovery
      description: Searches Gmail, scans each message for deadlines and saves every
        hit. Items past due within the last 90 days are returned as missed.
      parameters:
        - name: langs
          in: query
          required: false
          schema:
            type: string
            example: he,en,ru
          description: "Comma separated list of 1-3 packs: he, en, ru. Default he."
        - name: months
          in: query
          required: false
          schema:
            type: integer
          description: History window in months
      responses:
        "200":
          description: Scan result
          content:
            application/json:
              schema:
                type: object
                properties:
                  langs:
                    type: array
                    items:
                      type: string
                  historyMonths:
                    type: integer
                  terms:
                    type: array
                    items:
                      type: string
                  query:
                    type: string
                    description: Gmail search query used
                  scanned:
                    type: integer
                    description: Messages scanned
                  proposals:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        "400":
          description: Unsupported language
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: invalid_langs
                  message:
                    type: string
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: error
                  message:
                    type: string
