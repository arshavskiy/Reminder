  /api/webhooks/resend:
    post:
      summary: "Resend webhook: bounces, complaints and inbound email"
      tags:
        - Webhooks
      description: Verified with the Svix signature headers and
        `RESEND_WEBHOOK_SECRET`. `email.received` events are acknowledged
        immediately and imported in the background (email-in). Bounce and
        complaint events mark the reminder as errored.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  enum:
                    - email.received
                    - email.bounced
                    - email.complained
                    - email.delivery_delayed
                data:
                  type: object
                  properties:
                    email_id:
                      type: string
                    to:
                      type: array
                      items:
                        type: string
                  additionalProperties: true
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        "400":
          description: Signature invalid or payload malformed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: invalid webhook
                  message:
                    type: string
        "503":
          description: RESEND_WEBHOOK_SECRET not configured
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: error
                  message:
                    type: string
      parameters:
        - name: svix-id
          in: header
          required: true
          schema:
            type: string
        - name: svix-timestamp
          in: header
          required: true
          schema:
            type: string
        - name: svix-signature
          in: header
          required: true
          schema:
            type: string
