<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <style>
    .bg { fill: #F8FAFC }
    .sidenav { fill: #0F172A }
    .card { fill: #FFFFFF; stroke: #E6EEF8; rx:12 }
    .muted { fill: #6B7280; font-family: Inter, Roboto, Arial }
    .title { fill: #0F172A; font-family: Inter, Roboto, Arial; font-weight:700 }
    .accent { fill: #0EA5E9 }
    .button { fill: #0EA5E9; rx:8 }
    .button-text { fill: #FFFFFF; font-weight:700 }
  </style>
  <rect class="bg" width="1400" height="900"/>
  <!-- Left navigation -->
  <rect x="0" y="0" width="220" height="900" class="sidenav"/>
  <text x="32" y="60" fill="#FFFFFF" font-size="18" font-family="Inter, Roboto, Arial" font-weight="700">Reminder</text>
  <g fill="#94A3B8" font-family="Inter, Roboto, Arial">
    <text x="32" y="120">Dashboard</text>
    <text x="32" y="160" fill="#FFFFFF">Profile</text>
    <text x="32" y="200">Tasks</text>
    <text x="32" y="240">Clients</text>
  </g>

  <!-- Content area -->
  <rect x="260" y="40" width="1080" height="780" rx="12" fill="none"/>

  <!-- Profile card -->
  <rect class="card" x="280" y="60" width="820" height="720"/>
  <text x="320" y="120" class="title" font-size="22">Alex Brown</text>
  <text x="320" y="150" class="muted" font-size="14">Product Manager — alex@example.com</text>

  <!-- Two-column form -->
  <rect x="320" y="180" width="360" height="120" rx="8" fill="#FBFEFF" stroke="#E6EEF8"/>
  <text x="340" y="210" fill="#0F172A" font-size="14">First Name</text>
  <text x="320" y="232" class="muted" font-size="12">Alex</text>

  <rect x="700" y="180" width="360" height="120" rx="8" fill="#FBFEFF" stroke="#E6EEF8"/>
  <text x="720" y="210" fill="#0F172A" font-size="14">Last Name</text>
  <text x="700" y="232" class="muted" font-size="12">Brown</text>

  <rect x="320" y="320" width="740" height="160" rx="8" fill="#FBFEFF" stroke="#E6EEF8"/>
  <text x="340" y="350" fill="#0F172A" font-size="14">Bio</text>
  <text x="340" y="376" class="muted" font-size="12">Experienced product manager focused on building reminder and scheduling features that help teams stay on track.</text>

  <!-- Right-side info column -->
  <rect x="1110" y="60" width="230" height="320" rx="10" class="card"/>
  <text x="1160" y="120" fill="#0F172A" font-size="16" font-family="Inter, Roboto, Arial" font-weight="700">Account</text>
  <text x="1160" y="150" class="muted" font-size="12">Joined Jan 2024</text>
  <rect x="1110" y="400" width="230" height="160" rx="10" class="card"/>
  <text x="1160" y="440" fill="#0F172A" font-size="14">Preferences</text>
  <text x="1160" y="470" class="muted" font-size="12">Notifications: On</text>

  <!-- Save button -->
  <rect x="980" y="640" width="120" height="44" class="button"/>
  <text x="1040" y="668" class="button-text" font-size="14" text-anchor="middle">Save</text>

  <text x="280" y="820" class="muted" font-size="12">Variant 2 — left nav + card-based form for quick access and dense data entry</text>
</svg>