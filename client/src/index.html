<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Favicon (option B full-color, v2 cache-bust) -->
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32-v2.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192-v2.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/icon-512-v2.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon-v2.png" />
  <link rel="shortcut icon" href="/favicon-32-v2.png" />
  <link rel="icon" type="image/svg+xml" href="/favicon-v2.svg" />

  <meta name="google-site-verification" content="g2L4BoBhfhzGniPPKNjOUuyobqBCV4eLH4aVlKuXTtw" />
  <meta name="theme-color" content="#18a058" />
  <link rel="canonical" href="https://remindocr.com/" />
  <meta
    name="description"
    content="RemindOCR — מערכת לניהול תסקירי בדיקה, מסמכים, לקוחות ותזכורות, עם חילוץ נתונים אוטומטי וייבוא PDF אופציונלי מ-Gmail."
  />

  <!-- Open Graph (used by Facebook, LinkedIn, WhatsApp, etc.) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="RemindOCR" />
  <meta property="og:locale" content="he_IL" />
  <meta property="og:url" content="https://remindocr.com/" />
  <meta property="og:title" content="RemindOCR — מערכת ניהול תסקירים ותזכורות" />
  <meta
    property="og:description"
    content="ניהול תסקירי בדיקה, מסמכים, לקוחות ותזכורות, עם חילוץ נתונים אוטומטי וייבוא PDF אופציונלי מ-Gmail."
  />
  <meta property="og:image" content="https://remindocr.com/og-image.png" />
  <meta property="og:image:secure_url" content="https://remindocr.com/og-image.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="RemindOCR — תצוגה מקדימה" />

  <!-- Twitter Card (falls back to Open Graph tags where possible, but explicit ones render more reliably) -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:url" content="https://remindocr.com/" />
  <meta name="twitter:title" content="RemindOCR — מערכת ניהול תסקירים ותזכורות" />
  <meta name="twitter:description" content="ניהול תסקירי בדיקה, מסמכים, לקוחות ותזכורות." />
  <meta name="twitter:image" content="https://remindocr.com/og-image.png" />
  <meta name="twitter:image:alt" content="RemindOCR — תצוגה מקדימה" />

  <!-- iOS standalone (hide Safari chrome when added to Home Screen) -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="RemindOCR" />

  <!-- Windows tiles / "Install app" pinning: Edge/Windows read the PWA manifest's
       icons + theme_color directly, no separate browserconfig.xml needed. -->
  <meta name="msapplication-TileColor" content="#18a058" />
  <meta name="msapplication-config" content="none" />

  <title>RemindOCR — מערכת ניהול תסקירים ותזכורות</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="main.ts"></script>
</body>
</html>
